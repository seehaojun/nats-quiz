<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Nat's Quiz — interactive Singapore P4 quiz app covering Science, English, Math, and Chinese.">
<meta name="theme-color" content="#5b6cff">
<title>Nat's Quiz — P4</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="app" id="app">

<!-- Dashboard / Home -->
<section class="screen" id="dashboardScreen" style="position:relative" aria-labelledby="dashboardTitle">
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">&#9790;</button>
  <h1 id="dashboardTitle">Nat's Quiz</h1>
  <div class="dashboard-stats" id="dashStats" aria-label="Your stats"></div>
  <div class="daily-progress" id="dailyProgress" aria-label="Today's progress"></div>
  <div class="dashboard-actions" id="dashboardActions"></div>
  <h2 class="section-title">Choose a Subject</h2>
  <div class="subject-grid" id="subjectGrid" role="list"></div>
  <div class="badges-section" id="badgesSection"></div>
</section>

<!-- Theme Selection -->
<section class="screen" id="themeScreen" style="display:none" aria-labelledby="themeScreenTitle">
  <button class="back-btn" id="backToDashboard" type="button">&larr; All Subjects</button>
  <h1 id="themeScreenTitle">Science</h1>
  <p id="themeScreenDesc">Pick a theme to start</p>
  <div class="theme-grid" id="themeGrid" role="list"></div>
</section>

<!-- Topic Selection -->
<section class="screen" id="homeScreen" style="display:none" aria-labelledby="homeTitle">
  <button class="back-btn" id="backToThemes" type="button">&larr; All Themes</button>
  <h1 id="homeTitle">Diversity</h1>
  <p id="homeSubtitle">Pick a topic</p>
  <div id="topicButtons"></div>
</section>

<!-- Quiz -->
<section class="screen" id="quizScreen" style="display:none" aria-labelledby="topicTitle" aria-live="polite">
  <button class="back-btn" id="backToTopics" type="button">&larr; Back</button>
  <div class="quiz-header">
    <h2 id="topicTitle"></h2>
    <div class="score-display" id="scoreDisplay" aria-label="Current score">0 / 0</div>
  </div>
  <div class="progress-bar" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" id="progressFill"></div></div>
  <div class="timer-text" id="timerText" aria-live="off"></div>
  <div class="timer-bar" id="timerBar"><div class="timer-fill" id="timerFill"></div></div>
  <div class="hard-score-display" id="hardScoreDisplay"></div>
  <div class="question-card">
    <div class="q-number" id="qNumber"></div>
    <div class="q-text" id="qText"></div>
    <ul class="options" id="optionsList" role="listbox" aria-label="Answer options"></ul>
    <div class="explanation" id="explanation" role="status" aria-live="polite"></div>
    <div class="time-bonus" id="timeBonus" aria-live="polite"></div>
  </div>
</section>

<!-- Results -->
<section class="screen" id="resultsScreen" style="display:none" aria-labelledby="resultsTitle">
  <div class="results-card">
    <h2 id="resultsTitle">Quiz Done!</h2>
    <div class="xp-gained" id="xpGained"></div>
    <div class="big-score"><span id="finalScore"></span></div>
    <div class="grade" id="gradeLabel"></div>
    <div class="new-badges" id="newBadges"></div>
    <div class="wrong-list" id="wrongList"></div>
  </div>
  <button class="restart-btn practice-wrong-btn" id="practiceWrongBtn" type="button" style="display:none">Practice Wrong Answers</button>
  <button class="restart-btn" id="tryAgainBtn" type="button">Try Again</button>
  <button class="restart-btn home-btn" id="pickAnotherBtn" type="button">Pick Another Topic</button>
  <button class="restart-btn home-btn" id="resultsHomeBtn" type="button">Home</button>
</section>

<!-- Progress Dashboard -->
<section class="screen" id="progressScreen" style="display:none" aria-labelledby="progressTitle">
  <button class="back-btn" id="backFromProgress" type="button">&larr; Back to Home</button>
  <h1 id="progressTitle">Progress</h1>
  <div id="progressOverall" class="progress-overall"></div>
  <div id="progressSubjects"></div>
</section>

<!-- Badge notification toast -->
<div class="badge-toast" id="badgeToast" role="status" aria-live="polite"></div>

</main>

<!-- Data files — Science -->
<script src="data/diversity.js"></script>
<script src="data/cycles.js"></script>
<script src="data/systems.js"></script>
<script src="data/energy.js"></script>
<script src="data/interactions.js"></script>
<script src="data/matter.js"></script>
<script src="data/magnets.js"></script>
<!-- Open-ended sample questions: must load AFTER the science theme files
     because it appends an `open` array to existing theme objects. -->
<script src="data/open-samples.js"></script>
<!-- Data files — English -->
<script src="data/grammar.js"></script>
<script src="data/vocabulary.js"></script>
<script src="data/comprehension.js"></script>
<script src="data/synthesis.js"></script>
<script src="data/editing.js"></script>
<script src="data/visualtext.js"></script>
<script src="data/vocabcloze.js"></script>
<!-- Data files — Math -->
<script src="data/wholenumbers.js"></script>
<script src="data/fractions.js"></script>
<script src="data/decimals.js"></script>
<script src="data/measurement.js"></script>
<script src="data/money.js"></script>
<script src="data/geometry.js"></script>
<script src="data/tables.js"></script>
<!-- Data files — Chinese -->
<script src="data/hanzi.js"></script>
<script src="data/yufa.js"></script>
<script src="data/cloze.js"></script>
<script src="data/yuedu.js"></script>
<script src="data/chengyu.js"></script>
<script src="data/sentence.js"></script>

<!-- Engine -->
<script src="js/storage.js"></script>
<script src="js/data-loader.js"></script>
<script src="js/app.js"></script>
</body>
</html>
